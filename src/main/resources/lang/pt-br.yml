livro:
  intro: "Há muito tempo, no vasto universo de Nexus, existia um reino de paz e prosperidade. Os deuses concederam aos mortais as poderosas Relíquias Nexus, artefatos de grande poder que garantiam o equilíbrio. Mas o tempo corrompeu a ganância, e a busca por poder destruiu o reino. Agora, as relíquias estão espalhadas pela terra, e uma nova era de conflito surge. Apenas os mais dignos poderão se tornar os mestres dos Nexus e restaurar o equilíbrio."
  reliquia: "Nexus do"
  base: "Todas as Reliquias precisam de Xp para evoluir.<break>As que possuem Special Manual para ativar tem que está agachado"
  guerreiro: "A história do guerreiro é de honra e combate. Ele se ergueu de batalhas antigas e jurou proteger os inocentes. Sua relíquia é o reflexo de sua força inabalável e coragem.<break><break>Level 1-7: Habilidade Rush! Ativa um poderoso avanço em direção ao inimigo.<break>Level 8-15: Muda a habilidade para 360°Slash! Um ataque giratório que atinge múltiplos alvos.<break>Level 16+: Muda a habilidade para Slash! Um golpe devastador que causa dano massivo.<break>Para evoluir precisa derrotar Monstros ou Bosses"
  ceifador: "O Ceifador não é a morte, mas o seu servo. Ele vagou pela terra por séculos, coletando almas caídas para alimentar sua própria força. Sua relíquia é a foice que corta o véu entre a vida e a morte.<break><break>Level 1-7: Habilidade DeathFear! Causa medo e debuff nos inimigos próximos.<break>Level 8-15: Muda a habilidade para NightSlash! Um ataque rápido e furtivo que causa mais dano à noite.<break>Level 16+: Muda a habilidade para SoulColector! Drena a vida e a energia dos inimigos para se curar.<break>Para evoluir precisa roubar vida"
  vida: "A relíquia da Vida foi forjada com a essência da criação. Ela se manifesta como um totem, protegendo e curando aqueles que a possuem. Seu poder é a antítese da Morte, trazendo esperança onde há desespero.<break><break>Level 1-7: Habilidade Resistance! Aumenta a resistência a ataques.<break>Level 8-15: Muda a habilidade para InstaHeal! Uma cura instantânea que pode salvar a vida em momentos críticos.<break>Level 16+: Muda a habilidade para Imunity! Concede imunidade temporária a todos os efeitos negativos.<break>Para evoluir precisa recuperar vida"
  mares: "Das profundezas do oceano, a relíquia dos Mares surgiu. Ela é o reflexo da fúria das ondas e da calma das águas profundas. Seu mestre controla as marés e invoca criaturas marinhas para lutar ao seu lado.<break><break>Level 1-7: Habilidade Water Strike! Lança um jato de água poderoso.<break>Level 8-15: Muda a habilidade para High Tide! Invoca uma onda gigante que empurra e afoga os inimigos.<break>Level 16+: Muda a habilidade para Ocean's Fury! Causa uma tempestade marinha que afeta todos os inimigos na área.<break>Para evoluir precisa derrotar criaturas marinha, monstros ou bosses"
  barbaro: "O Bárbaro é uma lenda de força bruta e fúria. Sua relíquia é o machado que usou para destruir seus inimigos. Ele vive para a batalha e a glória, e sua relíquia reflete essa paixão.<break><break>Level 1-7: Habilidade War Cry! Um grito de guerra que inspira aliados e assusta inimigos.<break>Level 8-15: Muda a habilidade para Spinning Strike! Um ataque giratório que causa dano em área.<break>Level 16+: Muda a habilidade para Berserker! Entra em um estado de fúria que aumenta o dano e a velocidade.<break>Para evoluir precisa derrotar Monstros ou Bosses"
  fazendeiro: "A relíquia do Fazendeiro é um símbolo de prosperidade e abundância. Ela foi forjada com a terra e o sol, e seu mestre pode controlar a natureza. Com essa relíquia, é possível fazer a vida florescer onde quer que esteja.<break><break>Level 1-7:Habilidade Green Hand! Acelera o crescimento das plantações ao redor.<break>Level 8-15:Muda a habilidade para Gift Creation! Cria itens da natureza, como sementes e vegetais.<break>Level 16+:Muda a habilidade para Essence Creation! Converte a energia vital da terra em itens valiosos.<break>Para evoluir precisa colher plantações"
  espiao: "O Espião sempre esteve nas sombras. Sua relíquia é uma máscara que o torna invisível, permitindo que ele se mova sem ser detectado. O Espião usa sua astúcia e habilidades para enganar e confundir seus inimigos.<break><break>Level 1-7:Habilidade Eye of Vigilance! Detecta a localização de inimigos próximos.<break>Level 8-15:Muda a habilidade para Emergency Escape! Teleporta-se para um local seguro em momentos de perigo.<break>Level 16+:Muda a habilidade para Soul Escape! Torna-se invisível e intangível por alguns segundos.<break>Para evoluir precisa usar a habilidade"
  arqueiro: "O Arqueiro é o mestre da distância. Sua relíquia é o arco que dispara flechas com uma precisão mortal. Suas flechas podem se transformar em explosões, veneno e outras ameaças.<break><break>Level 1-7: Habilidade Explosive! As flechas explodem ao atingir o alvo.<break>Level 8-15:Muda a habilidade para Toxic! Flechas envenenadas que causam dano ao longo do tempo.<break>Level 16+:Muda a habilidade para Supersonic Arrow! Dispara uma flecha que quebra a barreira do som, causando dano massivo e atordoando o inimigo.<break>Para evoluir precisa acerta a flecha em monstros ou bosses"
  cacador: "O Caçador é o mestre da caça, um predador impiedoso. Sua relíquia é a besta que dispara flechas com precisão cirúrgica. Com a besta, ele pode imobilizar, congelar e atordoar seus inimigos.<break><break>Level 1-7: Habilidade Explosive! As flechas explodem ao atingir o alvo.<break>Level 8-15:Muda a habilidade para Freeze! Flechas que congelam o inimigo, imobilizando-o.<break>Level 16+:Muda a habilidade para Minigun! Dispara uma saraivada de flechas de forma rápida e precisa.<break>Para evoluir precisa acerta a flecha em monstros ou bosses"
  tempestade: "A relíquia da Tempestade foi forjada com o poder do raio e do vento. Ela é o reflexo da fúria da natureza. Seu mestre pode invocar raios e ventos para destruir seus inimigos. Ele é a própria tempestade.<break><break>Level 1-7: Habilidade Electric Whip! Lança um chicote elétrico que causa dano e Lentidão.<break>Level 8-15:Muda a habilidade para Electric Explosion! Causa uma explosão de raios que atinge todos os inimigos próximos.<break>Level 16+:Muda a habilidade para Tempest! Invoca uma tempestade de raios que cai sobre os inimigos.<break>Para evoluir precisa derrotar Monstros ou Bosses"
  mineiro: "O Mineiro é o mestre da terra. Sua relíquia é a picareta que pode quebrar qualquer rocha, até mesmo as mais duras. Ele pode ver o interior da terra e encontrar tesouros escondidos.<break><break>Level 1-7: Habilidade Midas! Transforma blocos comuns em valiosos recursos.<break>Level 8-15:Muda a habilidade para Collapse! Faz com que a terra ao redor do inimigo desmorone, soterrando-o.<break>Level 16+:Muda a habilidade para Heart of the Mountain! Aumenta a velocidade de mineração e a chance de encontrar itens raros.<break>Para evoluir precisa minerar minerios"
  fenix: "A Fênix é um ser imortal que renasce das cinzas. Sua relíquia é um par de asas que concede a seu mestre a capacidade de voar e de renascer de forma gloriosa. Ele pode se tornar uma explosão de fogo e renascer das cinzas.<break><break>Level 1-7:Habilidade Aurora Explosion! Causa uma explosão de fogo ao atingir o chão, queimando os inimigos.<break>Level 8-15:Muda a habilidade para Rising Flames! Aumenta a velocidade de voo e a proteção contra o fogo.<br>Level 16+:Muda a habilidade para Supernova! Causa uma explosão massiva de fogo que destrói tudo ao redor.<break>Para evoluir precisa voar com fogos de artificios"
  protetor: "O Protetor é um baluarte de defesa. Sua relíquia é um escudo que pode refletir ataques e defender o usuário de qualquer dano. Ele é a muralha que se ergue contra o caos.<break><break>Level 1-7: Habilidade Steel Blood! Aumenta a defesa e a resistência a dano.<break>Level 8-15:Muda a habilidade para Avenger Bastion! Cria um campo de força que protege o usuário e aliados próximos.<break>Level 16+:Muda a habilidade para Reflect! Reflete o dano recebido de volta para o inimigo.<break>Para evoluir precisa se defender usando o escudo"
  hulk: "A relíquia do Hulk foi forjada com a força de um gigante. Ela se manifesta como uma armadura que concede a seu mestre uma força e resistência sobre-humanas. Ele pode pular distâncias incríveis e esmagar a terra com um único golpe.<break><break>Level 1-7: Habilidade Colossal Jump! Um super pulo que causa dano ao cair.<break>Level 8-15:Muda a habilidade para Cracked Earth! Um golpe no chão que causa um terremoto que afeta inimigos próximos.<break>Level 16+:Muda a habilidade para Smash! Uma habilidade que causa dano massivo em área.<break>Para evoluir precisa receber dano de monstros ou bosses"
  sculk: "O Sculk é um ser das trevas, que vive nas profundezas da terra. Sua relíquia é um eco, um som que pode ser usado para localizar inimigos e destruir a terra. Ele é a personificação do silêncio e do medo.<break><break>Level 1-7: Habilidade Sonar! Emite um sonar que revela a localização de inimigos próximos.<break>Level 8-15:Muda a habilidade para Sonic Boom! Lança um grito sônico que causa dano em área.<break>Level 16+:Muda a habilidade para Ultimate Sonic Boom! Uma explosão sônica massiva que destrói tudo ao redor.<break>Para evoluir precisa ser atacado pelo Warden e sobreviver"
  pescador: "O Pescador é o mestre dos mares. Sua relíquia é uma vara de pescar que pode invocar criaturas marinhas para lutar ao seu lado. Ele é o senhor dos peixes e das profundezas.<break><break>Level 1-7: Habilidade Fish Rain! Invoca uma chuva de peixes que causa dano em área.<break>Level 8-15:Muda a habilidade para Rough Sea! Cria ondas que empurram e afogam os inimigos.<break>Level 16+:Muda a habilidade para Fishnado! Um tornado de peixes que causa dano massivo.<break>Para evoluir precisa acertar o anzol em animais marinhos"
  flash: "O Flash é o mestre da velocidade. Sua relíquia são um par de botas que concedem a seu mestre uma velocidade sobre-humana. Ele é o raio que corre pelo campo de batalha, e seus inimigos mal conseguem vê-lo.<break><break>Level 1-7: Habilidade Dash! Um avanço rápido em uma direção.<break>Level 8-15:Muda a habilidade para Flash Step! Teleporta-se para um local próximo, confundindo os inimigos.<break>Level 16+:Muda a habilidade para Tornado! Um tornado de vento que causa dano em área e repele os inimigos.<break>Para evoluir precisa usar a habilidade"
  mago: "O Mago é o mestre da magia. Sua relíquia é um livro de feitiços que pode lançar magias poderosas. Ele pode conjurar bolas de fogo, escudos arcanos e outras magias para destruir seus inimigos.<break><break>Level 1-5: 3 mágias, bola de fogo, escudo arcano e flecha congelada<break>Level 6-10: +2 novas mágias, corrente arcana e Onda do caos<break>Level 11-15: +2 novas mágias, Tempestade Arcana e Voo Arcano<break>Level 16+: +2 novas mágias, Eggification e Fragmento do Caos<break>Para evoluir precisa beber poções"
  ladrao: "O Ladrão é o mestre da astúcia. Sua relíquia é uma trouxa que pode roubar os itens de seus inimigos. Ele se move nas sombras, e seus inimigos nunca sabem de onde o próximo ataque virá.<break><break>Level 1-7: Habilidade Smoke Bomb! Lança uma bomba de fumaça que o torna invisível.<break>Level 8-15:Muda a habilidade para Roubo Gravitacional! Rouba itens dos inimigos próximos e os adiciona ao seu inventário.<break>Level 16+:Muda a habilidade para Fuga! Teleporta-se para um local seguro.<break>Para evoluir precisa roubar itens com a reliquia"
  domador: "O Domador é o mestre das feras. Sua relíquia é uma pá que pode invocar criaturas para lutar ao seu lado. Ele pode se comunicar com os animais, e eles o servem com lealdade incondicional.<break><break>Level 1-5: Lobinho! Invoca um pequeno lobo para lutar ao seu lado.<break>Level 6-10:Muda a habilidade para Lobo! Invoca um lobo mais forte para lutar ao seu lado.<break>Level 11-15:Muda a habilidade para Alcateia! Invoca uma alcateia de lobos para lutar ao seu lado.<break>Level 16+:Muda a habilidade para Alcateia Omega! Invoca uma alcateia de lobos gigantes e poderosos para lutar ao seu lado.<break>Para evoluir precisa domesticas animais/pets"
  cozinheiro: "O Cozinheiro é o mestre da culinária. Sua relíquia é um garfo que pode invocar uma chuva de comida, curando e fortalecendo os aliados. Ele é a personificação da fartura e da cura.<break><break>Level 1-7: Chuva de comida! Invoca uma chuva de comida que cura e satura os aliados.<break>Level 8-15:Muda a habilidade para Banquete do glutão! Invoca um banquete que cura e satura os aliados, e também concede efeitos positivos.<break>Level 16+:Muda a habilidade para Bolo do Caos! Um bolo que ao ser consumido, causa efeitos aleatórios, tanto positivos quanto negativos.<break>Para evoluir precisa se alimentar"
  construtor: "O Construtor é o mestre da criação. Sua relíquia é um martelo que pode construir e destruir blocos com facilidade. Ele pode se mover mais rapidamente ao construir e pode criar estruturas em instantes.<break><break>Level 1-7: Canteiro de obras! Aumenta a velocidade de construção e a resistência a ataques.<break>Level 8-15:Muda a habilidade para Pilar! Cria um pilar de blocos que pode ser usado para se mover rapidamente.<break>Level 16+:Muda a habilidade para Formiga Voadora! Permite que o usuário voe por alguns segundos, e enquanto voa, pode se mover mais rapidamente e construir mais rápido.<break>Para evoluir precisa construir"
  abissal: "A relíquia Abissal foi forjada nas profundezas do vazio, onde as leis da física não se aplicam. Seu mestre pode criar fendas no espaço, teleportando-se para o local desejado. Ele é o senhor do vazio e do caos.<break><break>Level 1-7: Rasgo Abissal! Cria um portal que teletransporta o jogador.<break>Level 8-15:Muda a habilidade para Vácuo! Cria uma explosão gravitacional que suga os inimigos para o centro.<break>Level 16+:Muda a habilidade para Black Hole! Cria um buraco negro que suga e destrói tudo ao redor.<break>Para evoluir precisa se teleportar"
  cronosombra: "O Cronossombra é o mestre do tempo. Sua relíquia é um relógio que pode manipular o fluxo do tempo, parando-o para inimigos e acelerando-o para si mesmo. Ele é o senhor do tempo e da morte.<break><break>Level 1-7: Sombra Congelante! Diminui a velocidade de inimigos próximos.<break>Level 8-15:Muda a habilidade para Eclipse Temporal! Para o tempo para todos os inimigos em uma área.<break>Level 16+:Muda a habilidade para Paradoxo Temporal! Volta no tempo e reverte o dano recebido.<break>Para evoluir precisa usar o special"
  assassino: "O Assassino é o mestre da furtividade. Sua relíquia é uma espada que pode se tornar invisível, permitindo que ele ataque seus inimigos sem ser visto. Ele se move nas sombras, e seus inimigos nunca sabem de onde o próximo ataque virá.<break><break>Level 1-7: Dash Venenoso! Causa um dash que envenena o inimigo ao ser atingido.<break>Level 8-15:Muda a habilidade para Execução Silenciosa! Causa dano massivo a um inimigo com um ataque furtivo.<break>Level 16+:Muda a habilidade para Invisibilidade Suprema! Torna-se completamente invisível, não podendo ser detectado por mobs ou outros jogadores.<break>Para evoluir precisa derrotar com critico"
  frostis: "O Frostis é o mestre do gelo. Sua relíquia é um fragmento de gelo que pode congelar e destruir os inimigos. Ele pode criar barreiras de gelo e lançar projéteis de gelo para congelar os inimigos.<break><break>Level 1-7: Cristal Congelante! Cria um cristal de gelo que causa dano e Lentidão ao atingir o inimigo.<break>Level 8-15:Muda a habilidade para Lego Prismatico! Cria uma barreira de gelo que protege o usuário e reflete ataques.<break>Level 16+:Muda a habilidade para Tempestade de Cristal Gelido! Causa uma tempestade de gelo que congela e causa dano em área.<break>Para evoluir precisa congelar mobs"
  necromante: "O Necromante é o mestre dos mortos. Sua relíquia é um crânio que pode invocar esqueletos para lutar ao seu lado. Ele pode controlar os mortos, e eles o servem com lealdade incondicional.<break><break>Level 1-7: Chamado das Sombras! Invoca esqueletos para lutar ao seu lado.<break>Level 8-15:Muda a habilidade para Cemiterio! Invoca uma horda de esqueletos e zumbis para lutar ao seu lado.<break>Level 16+:Muda a habilidade para Exercito do Submundo! Invoca um exército de esqueletos, zumbis e wither-skeletons para lutar ao seu lado.<break>Para evoluir precisa derrotas mobs não osseis"
  alquimista: "O Alquimista é o mestre das poções. Sua relíquia é um coração do mar que pode reverter efeitos negativos em positivos. Ele pode criar poções de cura, força e outros efeitos para fortalecer seus aliados.<break><break>Level 1-7: Explosão de Elixires! Lança uma poção que causa efeitos positivos em aliados próximos.<break>Level 8-15:Muda a habilidade para Bolas de Elixir! Lança várias poções que curam e fortalecem os aliados.<break>Level 16+:Muda a habilidade para Transmutação! Transforma efeitos negativos em positivos, e efeitos positivos em mais fortes.<break>Para evoluir precisa bebe poções"
  golem: "O Golem é um ser de rocha e ferro. Sua relíquia é uma armadura que concede a seu mestre uma força e resistência sobre-humanas. Ele pode criar nano-golens para lutar ao seu lado e causar dano massivo no chão.<break><break>Level 1-7: Nano Golens! Invoca pequenos golens para lutar ao seu lado.<break>Level 8-15:Muda a habilidade para Mini Golens! Invoca golens mais fortes para lutar ao seu lado.<break>Level 16+:Muda a habilidade para Golems! Invoca golens de ferro e neve para lutar ao seu lado.<break>Para evoluir precisa receber dano de monstros ou bosses"
  dragao: "O Dragão é o mestre do céu. Sua relíquia é a cabeça de um dragão que concede a seu mestre a capacidade de voar e de lançar fogo. Ele é a personificação da fúria e do poder, e sua relíquia reflete essa paixão.<break><break>Level 1-7: Sopro Draconico! Lança um sopro de fogo que causa dano em área.<break>Level 8-15:Muda a habilidade para Ira Draconica! Invoca uma chuva de fogo que cai sobre os inimigos.<break>Level 16+:Muda a habilidade para Forma Draconica! Transforma-se em um dragão, ganhando a capacidade de voar e de lançar fogo.<break>Para evoluir precisa derrotar bosses"
  morte: "No início, a Morte era apenas um conceito, um final inevitável. Mas a ganância e a guerra a deram forma, e ela se tornou uma entidade. As lendas dizem que ela veio à terra para cobrar as almas dos que ousaram desafiar o destino. Seus poderes são temidos por todos, e ela se alimenta do medo e da fraqueza dos inimigos. A relíquia da Morte é um fragmento de sua essência, um artefato que confere a seu mestre um poder avassalador, capaz de ceifar a vida e dominar o campo de batalha.<break><break>Level 1-5:<br>Passiva: Drena a vida dos inimigos próximos, aplicando efeitos de Wither e Fraqueza. Ativa 'Sombra da Morte' quando sua vida está baixa, dando invisibilidade e velocidade.<br>Habilidade (Duplo-Shift): 'Haki do Rei'. Causa Lentidão III, Fraqueza III, Náusea II e Wither III em um raio de 250 blocos.<br>Habilidade (Clique Direito): 'Ceifa da Alma'. Causa dano e Wither IV em um único alvo.<break><br>Level 6-10:<br>Passiva: Dreno de vida amplificado. 'Sombra da Morte' dura mais tempo e com mais velocidade.<br>Habilidade (Duplo-Shift): 'Haki do Rei' causa Lentidão IV, Fraqueza IV, Náusea III e Wither IV.<br>Habilidade (Clique Direito): 'Ceifa da Alma' causa mais dano e Wither V.<break><br>Level 11-15:<br>Passiva: Dreno de vida ainda mais rápido. 'Sombra da Morte' é ainda mais poderosa.<br>Habilidade (Duplo-Shift): 'Haki do Rei' causa Lentidão V, Fraqueza V, Náusea IV e Wither IV.<br>Habilidade (Clique Direito): 'Ceifa da Alma' causa dano massivo e Wither VI.<break><br>Level 16-20:<br>Passiva: Dreno de vida no máximo. 'Sombra da Morte' te torna quase intocável.<br>Habilidade (Duplo-Shift): 'Haki do Rei' causa Lentidão V, Fraqueza V, Náusea V e Wither V.<br>Habilidade (Clique Direito): 'Ceifa da Alma' causa dano fatal e Wither VI.<br>Para evoluir precisa derrotar monstros e bosses"
